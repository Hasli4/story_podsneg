  <style>
    html {
      background: #031d29;
      height: 100%;
      overscroll-behavior: none;
    }
    body {
      background:
        radial-gradient(ellipse at 50% -14%, rgba(104, 210, 208, .47), transparent 54%),
        radial-gradient(circle at 12% 79%, rgba(95, 180, 192, .3), transparent 32%),
        radial-gradient(circle at 88% 82%, rgba(255, 225, 153, .18), transparent 30%),
        linear-gradient(135deg, #063b4a, #0a6370 52%, #043743);
      min-height: 100%;
      overscroll-behavior: none;
      touch-action: manipulation;
    }
    #tyrano_base {
      box-shadow: 0 0 0 1px rgba(202, 251, 250, .22), 0 18px 55px rgba(0, 0, 0, .46);
      touch-action: manipulation;
    }
    #loading-screen {
      align-items: center;
      background: linear-gradient(rgba(0, 25, 31, .24), rgba(0, 25, 31, .58)), url("./data/bgimage/главный_экранъ.webp") center / cover;
      color: #fff;
      display: flex;
      font-family: Arial, sans-serif;
      inset: 0;
      justify-content: center;
      bottom: auto;
      position: fixed;
      right: auto;
      text-align: center;
      transition: opacity .38s ease, visibility .38s ease;
      height: var(--app-viewport-height, 100vh);
      left: 0;
      top: 0;
      width: var(--app-viewport-width, 100vw);
      z-index: 2147483647;
    }
    #loading-screen.is-hidden { opacity: 0; pointer-events: none; visibility: hidden; }
    .loading-card {
      background: rgba(0, 42, 51, .83);
      border: 1px solid rgba(255, 255, 255, .6);
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .38);
      box-sizing: border-box;
      max-width: min(430px, calc(100vw - 40px));
      padding: 30px 32px 27px;
    }
    .loading-card__mark { color: #e8ffff; font: 2.5rem/1 Georgia, serif; text-shadow: 0 0 20px #75e1e1; }
    .loading-card h1 { font: 400 clamp(2rem, 7vw, 3.4rem)/1 Georgia, serif; margin: .45rem 0 .9rem; }
    .loading-card p { font-size: 1rem; line-height: 1.45; margin: 0; }
    .progress-track { background: rgba(255, 255, 255, .24); border-radius: 999px; height: 8px; margin: 22px 0 11px; overflow: hidden; }
    .progress-value { background: linear-gradient(90deg, #8ee4e5, #fff0a9); border-radius: inherit; height: 100%; transition: width .3s ease; width: 8%; }
    .loading-status { color: #d9f7f7; font-size: .85rem !important; min-height: 1.3em; }
    .loading-help { display: none; font-size: .85rem !important; margin-top: 1rem !important; }
    .loading-help button { background: transparent; border: 0; color: #fff0a9; cursor: pointer; font: inherit; padding: 0; text-decoration: underline; }
    .loading-actions { display: none; gap: .7rem; justify-content: center; margin-top: 1.25rem; }
    .loading-actions.is-visible { display: flex; }
    .loading-actions button { border-radius: 999px; cursor: pointer; font: 600 .95rem/1.2 Arial, sans-serif; padding: .7rem 1.05rem; }
    .loading-actions__sound { background: #fff0a9; border: 1px solid #fff0a9; color: #053640; }
    .loading-actions__silent { background: transparent; border: 1px solid rgba(255, 255, 255, .65); color: #fff; }
    #orientation-notice {
      align-items: center;
      background: rgba(0, 24, 34, .94);
      color: #fff;
      display: none;
      font-family: Arial, sans-serif;
      inset: 0;
      justify-content: center;
      padding: 24px;
      bottom: auto;
      position: fixed;
      right: auto;
      text-align: center;
      height: var(--app-viewport-height, 100vh);
      left: 0;
      top: 0;
      width: var(--app-viewport-width, 100vw);
      z-index: 2147483646;
    }
    .orientation-card {
      background: linear-gradient(155deg, rgba(4, 86, 96, .94), rgba(0, 39, 51, .98));
      border: 1px solid rgba(218, 255, 255, .58);
      border-radius: 22px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, .42);
      box-sizing: border-box;
      max-width: 340px;

    .orientation-card__icon { color: #fff0a9; font-size: 3rem; line-height: 1; margin-bottom: .7rem; }
    .orientation-card h2 { font: 400 1.55rem/1.2 Georgia, serif; margin: 0 0 .7rem; }
    .orientation-card p { font-size: .95rem; line-height: 1.45; margin: 0; }
    .orientation-card button {

      border: 1px solid rgba(255, 255, 255, .68);

      .loading-card { padding: 25px 22px 23px; }

<body onselectstart="return false" oncontextmenu="return false" ontouchmove="event.preventDefault()">
  <div id="loading-screen" role="status" aria-live="polite">
    <div class="loading-card">
      <div class="loading-card__mark" aria-hidden="true">❄</div>
      <h1>Подснежник</h1>
      <p>Один день бойца начинается…</p>
      <div class="progress-track" aria-hidden="true"><div class="progress-value" id="progress-value"></div></div>
      <p class="loading-status" id="loading-status">Подготавливаем историю…</p>
      <div class="loading-actions" id="loading-actions" aria-label="Выбор звука">
        <button class="loading-actions__sound" type="button" id="enter-with-sound">Войти со звуком</button>
        <button class="loading-actions__silent" type="button" id="enter-silently">Без музыки</button>
      </div>
      <p class="loading-help" id="loading-help">Загрузка остановилась? <button type="button" id="reload-page">Обновить страницу</button></p>
    </div>
  </div>
  <div id="orientation-notice" role="dialog" aria-labelledby="orientation-title" aria-describedby="orientation-description">
    <div class="orientation-card">
      <div class="orientation-card__icon" aria-hidden="true">↻</div>
      <h2 id="orientation-title">Поверните телефон</h2>
      <p id="orientation-description">Новелла задумана для горизонтального экрана — так иллюстрации, текст и кнопки остаются удобными.</p>
      <button id="continue-portrait" type="button">Продолжить в портретном</button>
    </div>
  </div>
  <div id="tyrano_base" class="tyrano_base" style="overflow:hidden" unselectable="on" ondragstart="return false"></div>
  <div id="vchat_base" class="vchat_base" style="overflow:hidden" unselectable="on" ondragstart="return false"></div>
  <div class="remodal-bg"></div>
  <div class="remodal" data-remodal-id="modal" data-remodal-options="hashTracking:false,closeOnEscape:false,closeOnOutsideClick:false">
    <h1 class="remodal_title"></h1>
    <p class="remodal_txt"></p><br />
    <button data-remodal-action="cancel" class="remodal-cancel">Cancel</button>
    <button data-remodal-action="confirm" class="remodal-confirm">OK</button>
  </div>
  <script>
    (function () {
      var screen = document.getElementById("loading-screen");
      var value = document.getElementById("progress-value");
      var status = document.getElementById("loading-status");
      var help = document.getElementById("loading-help");
      var actions = document.getElementById("loading-actions");
      var soundButton = document.getElementById("enter-with-sound");
      var silentButton = document.getElementById("enter-silently");
      var orientationDismiss = document.getElementById("continue-portrait");
      var tyranoBase = document.getElementById("tyrano_base");
      var documentRoot = document.documentElement;
      var current = 8;
      var finished = false;
      var titleReady = false;
      var menuAudio = null;

      function usesTouchViewport() {
        return Boolean(window.visualViewport) && (window.matchMedia("(pointer: coarse)").matches || navigator.maxTouchPoints > 0);
      }

      function syncVisualViewport() {
        if (!usesTouchViewport()) return;
        documentRoot.style.setProperty("--app-viewport-width", Math.round(window.visualViewport.width) + "px");
        documentRoot.style.setProperty("--app-viewport-height", Math.round(window.visualViewport.height) + "px");
      }

      (function adaptTyranoToMobileViewport() {
        if (!usesTouchViewport() || !window.jQuery) return;
        syncVisualViewport();
        window.jQuery.getViewPort = function () {
          return {
            width: window.visualViewport.width,
            height: window.visualViewport.height
          };
        };

        function refitMobileCanvas(attempt) {
          if (!usesTouchViewport()) return;
          syncVisualViewport();
          if (!window.TYRANO || !window.TYRANO.kag || !window.TYRANO.kag.config || !window.TYRANO.base) {
            if (attempt < 40) window.setTimeout(function () { refitMobileCanvas(attempt + 1); }, 50);
            return;
          }
          var config = window.TYRANO.kag.config;
          var width = parseInt(config.scWidth, 10);
          var height = parseInt(config.scHeight, 10);
          var viewport = window.visualViewport;
          var scale = Math.min(viewport.width / width, viewport.height / height);
          config.ScreenCentering = "false";
          window.TYRANO.base.fitBaseSize(width, height);
          window.setTimeout(function () {
            tyranoBase.style.marginLeft = Math.max(0, (viewport.width - width * scale) / 2) + "px";
            tyranoBase.style.marginTop = Math.max(0, (viewport.height - height * scale) / 2) + "px";
            window.scrollTo(0, 0);
          }, 120);
        }

        window.visualViewport.addEventListener("resize", function () { refitMobileCanvas(0); });
        window.addEventListener("orientationchange", function () { refitMobileCanvas(0); });
        refitMobileCanvas(0);
      })();

      function unlockTyranoAudio() {
        if (!window.TYRANO || !window.TYRANO.kag || window.TYRANO.kag.tmp.ready_audio) return;
        window.TYRANO.kag.readyAudio();
        window.TYRANO.kag.tmp.ready_audio = true;
      }

      function getMenuAudio() {
        if (menuAudio) return menuAudio;
        menuAudio = new Audio("./data/bgm/Highway_Nocturne_-_National_Sweetheart.mp3");
        menuAudio.loop = true;
        menuAudio.preload = "auto";
        menuAudio.volume = 0.62;
        return menuAudio;
      }

      window.PodsnegAudio = {
        startMenu: function () {
          unlockTyranoAudio();
          var audio = getMenuAudio();
          var promise = audio.play();
          if (promise) promise.catch(function () {});
        },
        resumeMenu: function () {
          if (menuAudio && menuAudio.paused) this.startMenu();
        },
        stopMenu: function () {
          if (!menuAudio) return;
          menuAudio.pause();
          menuAudio.currentTime = 0;
        },
        unlock: unlockTyranoAudio
      };

      (function installNonBlockingBgmTag() {
        if (!window.tyrano || !window.tyrano.plugin || !window.tyrano.plugin.kag || !window.tyrano.plugin.kag.tag) return;
        var tags = window.tyrano.plugin.kag.tag;
        if (!tags.playbgm || tags.playbgm_fast) return;
        tags.playbgm_fast = {
          vital: tags.playbgm.vital,
          pm: tags.playbgm.pm,
          start: function (pm) {
            if (this.kag.stat.play_bgm == 0) {
              this.kag.ftag.nextOrder();
              return;
            }
            var engineTag = this.kag.ftag.master_tag.playbgm;
            engineTag.start(Object.assign({}, pm, { stop: "true" }));
            this.kag.layer.showEventLayer();
            this.kag.ftag.nextOrder();
          }
        };
      })();

      (function protectGameInput() {
        var lastGameClick = 0;
        var minimumInterval = 260;
        tyranoBase.addEventListener("click", function (event) {
          var target = event.target;
          if (!target.closest || !target.closest(".layer_event_click, .event-setting-element")) return;
          var now = performance.now();
          if (now - lastGameClick < minimumInterval) {
            event.preventDefault();
            event.stopImmediatePropagation();
            event.stopPropagation();
            return;
          }
          lastGameClick = now;
        }, true);
        tyranoBase.addEventListener("dblclick", function (event) {
          event.preventDefault();
          event.stopImmediatePropagation();
          event.stopPropagation();
        }, true);
      })();

      function resetPortraitChoice() {
        if (window.matchMedia("(orientation: landscape)").matches) {
          document.documentElement.classList.remove("portrait-mode-accepted");
        }
      }

      function setProgress(percent, message) {
        current = Math.max(current, Math.min(percent, 100));
        value.style.width = current + "%";
        if (message) status.textContent = message;
      }
      function finish() {
        if (finished) return;
        finished = true;
        setProgress(100, "Готово");
        window.setTimeout(function () { screen.classList.add("is-hidden"); }, 220);
      }

      function showEntryChoice() {
        if (titleReady) return;
        titleReady = true;
        setProgress(100, "Сцена готова");
        actions.classList.add("is-visible");
      }

      document.addEventListener("DOMContentLoaded", function () { setProgress(40, "Собираем сцену…"); });
      window.addEventListener("load", function () { setProgress(62, "Читаем сценарий…"); });
      window.addEventListener("podsneg-title-ready", showEntryChoice);
      document.getElementById("reload-page").addEventListener("click", function () { window.location.reload(); });
      soundButton.addEventListener("click", function () {
        window.PodsnegAudio.startMenu();
        finish();
      });
      silentButton.addEventListener("click", function () {
        window.PodsnegAudio.unlock();
        finish();
      });
      orientationDismiss.addEventListener("click", function () {
        document.documentElement.classList.add("portrait-mode-accepted");
      });
      window.addEventListener("orientationchange", resetPortraitChoice);
      window.addEventListener("resize", resetPortraitChoice);
      window.setTimeout(function () { if (!finished) help.style.display = "block"; }, 15000);
      if (window.jQuery) {
        window.jQuery(document).ajaxStart(function () { setProgress(76, "Загружаем сценарий…"); });
        window.jQuery(document).ajaxStop(function () { if (!finished) setProgress(90, "Почти готово…"); });
      }
      window.setInterval(function () { if (!finished && current < 94) setProgress(current + 1); }, 900);
    })();
  </script>
</body>
