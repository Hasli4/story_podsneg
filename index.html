<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#003b45" />
    <meta name="description" content="Один день среди бойцов отряда: утренний свет, странное сияние и огонёк, который помогает понять, зачем ты здесь." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:url" content="https://hasli4.github.io/story_podsneg/" />
    <meta property="og:title" content="Подснежник — интерактивная визуальная новелла" />
    <meta property="og:description" content="Один день среди бойцов отряда: утренний свет, странное сияние и огонёк, который помогает понять, зачем ты здесь." />
    <meta property="og:image" content="https://hasli4.github.io/story_podsneg/Podsneg_HTML/data/bgimage/огонек.png" />
    <meta property="og:image:alt" content="Бойцы отряда собрались вокруг тёплого огонька" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Подснежник — интерактивная визуальная новелла" />
    <meta name="twitter:description" content="Утренний свет, странное сияние и огонёк, который помогает понять, зачем ты здесь." />
    <meta name="twitter:image" content="https://hasli4.github.io/story_podsneg/Podsneg_HTML/data/bgimage/огонек.png" />
    <title>Подснежник — визуальная новелла</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        min-height: 100vh;
      }
      body { background: #000; overflow: hidden; }
      .game-frame {
        border: 0;
        display: block;
        height: 100vh;
        height: 100dvh;
        width: 100vw;
      }
      .loading-screen {
        align-items: center;
        background:
          radial-gradient(circle at 50% 42%, rgba(255, 191, 77, .28), transparent 19rem),
          linear-gradient(145deg, #002c36, #021419 68%);
        color: #f7fbf8;
        display: flex;
        flex-direction: column;
        inset: 0;
        justify-content: center;
        opacity: 1;
        position: fixed;
        text-align: center;
        transition: opacity .45s ease, visibility .45s ease;
        z-index: 2;
      }
      .loading-screen--hidden { opacity: 0; pointer-events: none; visibility: hidden; }
      .loading-screen__snowdrop {
        filter: drop-shadow(0 0 16px rgba(244, 255, 223, .5));
        font: 4rem/1 Georgia, serif;
      }
      .loading-screen h1 { font: 400 clamp(2rem, 7vw, 3.8rem)/1 Georgia, serif; margin: .45rem 0; }
      .loading-screen p { font: 400 1rem/1.5 Arial, sans-serif; margin: .25rem 1.5rem; max-width: 22rem; }
      .loading-screen__help { display: none; margin-top: 1.25rem !important; }
      .loading-screen__help a { color: #fff5c5; }
    </style>
  </head>
  <body>
    <div class="loading-screen" id="loading-screen" role="status" aria-live="polite">
      <div class="loading-screen__snowdrop" aria-hidden="true">❄</div>
      <h1>Подснежник</h1>
      <p>Зажигаем огонёк и готовим историю…</p>
      <p class="loading-screen__help" id="loading-help">
        Загрузка занимает больше обычного. <a href="./Podsneg_HTML/">Открыть игру напрямую</a>
      </p>
    </div>
    <iframe
      id="game-frame"
      class="game-frame"
      src="./Podsneg_HTML/"
      title="Подснежник — визуальная новелла"
      allow="autoplay; fullscreen"
      allowfullscreen
    ></iframe>
    <script>
      (function () {
        var splash = document.getElementById("loading-screen");
        var help = document.getElementById("loading-help");

        window.addEventListener("message", function (event) {
          if (event.origin !== window.location.origin || !event.data || event.data.type !== "podsneg-title-ready") return;
          splash.classList.add("loading-screen--hidden");
        });

        window.setTimeout(function () { help.style.display = "block"; }, 15000);
      })();
    </script>
  </body>
</html>
