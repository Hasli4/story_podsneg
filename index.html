  <style>
    #loading-screen {
      align-items: center;
      background: linear-gradient(rgba(0, 25, 31, .24), rgba(0, 25, 31, .58)), url("./data/bgimage/главный_экранъ.png") center / cover;
      color: #fff;
      display: flex;
      font-family: Arial, sans-serif;
      inset: 0;
      justify-content: center;
      position: fixed;
      text-align: center;
      transition: opacity .38s ease, visibility .38s ease;
      z-index: 2147483647;
    }
    #loading-screen.is-hidden { opacity: 0; pointer-events: none; visibility: hidden; }
    .loading-card {
      background: rgba(0, 42, 51, .83);
      border: 1px solid rgba(255, 255, 255, .6);
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .38);
      box-sizing: border-box;
      max-width: min(430px, calc(100vw - 40px));
      padding: 30px 32px 27px;
    }
    .loading-card__mark { color: #e8ffff; font: 2.5rem/1 Georgia, serif; text-shadow: 0 0 20px #75e1e1; }
    .loading-card h1 { font: 400 clamp(2rem, 7vw, 3.4rem)/1 Georgia, serif; margin: .45rem 0 .9rem; }
    .loading-card p { font-size: 1rem; line-height: 1.45; margin: 0; }
    .progress-track { background: rgba(255, 255, 255, .24); border-radius: 999px; height: 8px; margin: 22px 0 11px; overflow: hidden; }
    .progress-value { background: linear-gradient(90deg, #8ee4e5, #fff0a9); border-radius: inherit; height: 100%; transition: width .3s ease; width: 8%; }
    .loading-status { color: #d9f7f7; font-size: .85rem !important; min-height: 1.3em; }
    .loading-help { display: none; font-size: .85rem !important; margin-top: 1rem !important; }
    .loading-help button { background: transparent; border: 0; color: #fff0a9; cursor: pointer; font: inherit; padding: 0; text-decoration: underline; }
  </style>
</head>
<body onselectstart="return false" oncontextmenu="return false" ontouchmove="event.preventDefault()">
  <div id="loading-screen" role="status" aria-live="polite">
    <div class="loading-card">
      <div class="loading-card__mark" aria-hidden="true">❄</div>
      <h1>Подснежник</h1>
      <p>Один день бойца начинается…</p>
      <div class="progress-track" aria-hidden="true"><div class="progress-value" id="progress-value"></div></div>
      <p class="loading-status" id="loading-status">Подготавливаем историю…</p>
      <p class="loading-help" id="loading-help">Загрузка остановилась? <button type="button" id="reload-page">Обновить страницу</button></p>
    </div>
  </div>
  <div id="tyrano_base" class="tyrano_base" style="overflow:hidden" unselectable="on" ondragstart="return false"></div>
  <div id="vchat_base" class="vchat_base" style="overflow:hidden" unselectable="on" ondragstart="return false"></div>
  <div class="remodal-bg"></div>
  <div class="remodal" data-remodal-id="modal" data-remodal-options="hashTracking:false,closeOnEscape:false,closeOnOutsideClick:false">
    <h1 class="remodal_title"></h1>
    <p class="remodal_txt"></p><br />
    <button data-remodal-action="cancel" class="remodal-cancel">Cancel</button>
    <button data-remodal-action="confirm" class="remodal-confirm">OK</button>
  </div>
  <script>
    (function () {
      var screen = document.getElementById("loading-screen");
      var value = document.getElementById("progress-value");
      var status = document.getElementById("loading-status");
      var help = document.getElementById("loading-help");
      var current = 8;
      var finished = false;

      function setProgress(percent, message) {
        current = Math.max(current, Math.min(percent, 100));
        value.style.width = current + "%";
        if (message) status.textContent = message;
      }
      function finish() {
        if (finished) return;
        finished = true;
        setProgress(100, "Готово");
        window.setTimeout(function () { screen.classList.add("is-hidden"); }, 220);
      }

      document.addEventListener("DOMContentLoaded", function () { setProgress(40, "Собираем сцену…"); });
      window.addEventListener("load", function () { setProgress(62, "Читаем сценарий…"); });
      window.addEventListener("podsneg-title-ready", finish);
      document.getElementById("reload-page").addEventListener("click", function () { window.location.reload(); });
      window.setTimeout(function () { if (!finished) help.style.display = "block"; }, 15000);
      if (window.jQuery) {
        window.jQuery(document).ajaxStart(function () { setProgress(76, "Загружаем сценарий…"); });
        window.jQuery(document).ajaxStop(function () { if (!finished) setProgress(90, "Почти готово…"); });
      }
      window.setInterval(function () { if (!finished && current < 94) setProgress(current + 1); }, 900);
    })();
  </script>
</body>
